version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: aipass
      POSTGRES_DB: aidb
    ports:
      - "5432:5432"
    volumes:
      # Maps your local OneDrive folder to the Postgres data directory
      - "C:/Users/justa/OneDrive/Documents/pgvector:/var/lib/postgresql/data"

# Note: The 'volumes' block at the bottom is removed
# because we are now using a direct host path (bind mount).